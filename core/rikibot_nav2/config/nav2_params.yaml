    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # 控制频率 20 Hz，即每 50 ms 计算一次速度指令
    controller_frequency: 20.0
    # 速度死区阈值。低于该值的速度会被当作 0，避免电机在极小速度下抖动
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters 进度检查器：防止机器人在原地卡住
    progress_checker: 
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5 #10 秒内必须移动至少 0.5 米
      movement_time_allowance: 10.0 #允许的时间窗口 10 秒 如果 10 秒内移动距离小于 0.5 米，就认为机器人卡住，触发失败处理（如重规划或恢复行为）
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.1 # 前进最大速度
      max_vel_y: 0.0
      max_vel_theta: 0.5  # 最大角速度
      min_speed_xy: 0.0
      max_speed_xy: 0.1 #合成平移速度矢量的模长上限，即 sqrt(vx² + vy²) ≤ max_speed_xy
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0 # 代价地图更新频率，默认5HZ
      publish_frequency: 4.0 # 代价地图发布频率，默认2HZ
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true # 跟着机器人移动的局部地图, 始终以 base_link 为中心的 3m x 3m 窗口
      width: 3 # 只有这个窗口内的传感器数据会被保留; 注意车前方只有 1.5m
      height: 3
      resolution: 0.05
      # 车体 29cm(前后/x) x 25cm(横向/y), 半宽半长折算成矩形足迹
      footprint: "[[0.145, 0.125], [0.145, -0.125], [-0.145, -0.125], [-0.145, 0.125]]"
      plugins: ["voxel_layer", "inflation_layer"] # 顺序有讲究: inflation_layer 必须在最后
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      # ================= 双源三维分层: 雷达 + 深度点云 =================
      #   scan        雷达(LaserScan), 它的点全部落在 z=0.21 那一层
      #   depth_cloud 深度点云(PointCloud2), 负责雷达扫描面以下的矮障碍
      #
      # 为什么必须是 voxel_layer(而不是 obstacle_layer):
      #   高度过滤和分层全靠体素网格。依据 nav2 头文件 voxel_layer.hpp 里的
      #   worldToMap3D(): wz < origin_z 直接 return false, 超出网格上界的点同样丢弃
      #   —— 网格边界本身就是一道高度滤波器。分层结果:
      #     雷达     z=0.21         -> 第 3 层 (0.20~0.25)
      #     矮障碍   z=0.05~0.17    -> 第 0~2 层
      #   雷达的清空射线是水平的, 且 VoxelLayer 重写了 raytraceFreespace 按体素清,
      #   所以它只清自己那一层, 碰不到下面几层 —— 矮障碍的标记不会被擦掉。
      #
      # 高度过滤有两道, 两道都要:
      #   1) 每个源的 min/max_obstacle_height —— 过滤发生在观测缓冲区里, 过滤的是
      #      "合法命中点", 而**标记和清空都用过滤后的点**。所以地面点(z≈0)从源头
      #      就不参与: 既不标记, 也不会产生向下的清空射线。
      #      (这两个参数是源级的, 已从 observation_buffer.hpp 的构造函数签名确认)
      #   2) 体素网格的 origin_z / z_voxels —— 决定点落在哪个体素。
      #
      # 最关键的一条: raytrace_min_range = 0.6
      #   相机 0.6m 以内测不到障碍。这一段既不该标记、也不该清空 —— 于是标记天然保留:
      #   车即使贴到 0.3m, 障碍也不会从代价地图上消失, 规划器就不会改出"穿过去"的
      #   新路径(那正是之前"先绕开、靠近了又撞"的机理)。
      #   同时深度源能一直标到 0.6m —— 点云保留真实高度, 不像虚拟激光那样受
      #   "图像行带"限制(行带在 0.95m 处就漏检, 数学上无解)。
      #
      # depth_cloud 的开关: 这个源**始终**保留, 是否生效由启动参数 use_depth_scan 控制。
      #   设 false 时转换节点不启动, /camera/depth/points 没有数据, 这个源就是"哑的",
      #   代价地图退化成纯雷达 —— 对照实验只需一条命令, 不用改文件。
      #   所以看到 depth_cloud 没有数据 / 没有发布者, 属于预期, 不是故障。
      #
      # unknown_threshold 故意不设: 默认 15, 而网格只有 4 层(一列最多 4 个被占),
      #   永远触发不了。若手动设成 <=4, 整列会被判成"未知", 障碍反而消失。
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        # 网格覆盖 0.05~0.35m (6 层 x 0.05)。用 6 层而不是 4 层, 是为了给雷达的
        # 0.21 留足余量: 4 层时上界只有 0.25, 一旦雷达实测高度略高, 它自己的点就会
        # 掉出网格、整个雷达失效。层数多一层几乎不增加算力。
        origin_z: 0.05
        z_resolution: 0.05
        z_voxels: 6
        mark_threshold: 0
        observation_sources: scan depth_cloud
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          # 雷达源**不设**高度上界: LaserScan 的点全在雷达实际高度上, 一旦上界比
          # 实际高度低, 整条雷达数据会被丢掉 —— 这个耦合太危险。高度范围交给体素网格管。
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          observation_persistence: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        depth_cloud:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          # 局部图关掉 clearing: 10Hz 下逐点射线太贵。局部图是滚动窗口,
          # 车走开后旧标记自然滚出去。(全局图开 clearing, 见 global_costmap)
          clearing: False
          marking: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.25
          # observation_persistence 必须保持 0.0! 它的语义是"观测数据在缓冲区里保留几秒",
          # persistence>0 时 nav2 的 ObservationBuffer 是**追加**而不是替换: 本点云 22Hz、
          # 每帧约 4800 点, 保留 2 秒就等于缓冲区里堆 20 万个点, 每轮更新都要全部变换+
          # 射线清空一遍 —— 代价地图直接卡死, 表现就是"障碍完全不出现"。
          # 障碍不消失靠的是下面的 raytrace_min_range=0.6(盲区段落不被清空), 不需要这个。
          observation_persistence: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.6
          obstacle_max_range: 3.0
          obstacle_min_range: 0.6
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0 # 每秒重新计算一次(叠加静态层/障碍层/膨胀层)
      publish_frequency: 1.0 # 通常 publish <= update
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # 车体 29cm(前后/x) x 25cm(横向/y)
      footprint: "[[0.145, 0.125], [0.145, -0.125], [-0.145, -0.125], [-0.145, 0.125]]"
      resolution: 0.05
      track_unknown_space: true # true: 未知区域标记为 NO_INFORMATION, 规划器会避开
      plugins: ["static_layer", "voxel_layer", "inflation_layer"] # inflation_layer 必须最后
      # 和局部代价地图完全一致, 详细说明见 local_costmap 里那段。唯一区别:
      #   depth_cloud 的 clearing=True —— 全局图只有 1Hz(逐点射线算力够), 而且它
      #   不滚动、会长期存在, 必须能把"已经搬走的障碍"清掉, 否则就成了永久幻影障碍。
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.05
        z_resolution: 0.05
        z_voxels: 6
        mark_threshold: 0
        # depth_cloud 必须也在这里: 否则全局规划器看不到矮障碍, 会一直给出
        # 一条穿过障碍物的路径, 局部控制器躲不掉, 最后就是撞上去。
        observation_sources: scan depth_cloud
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          # 雷达源**不设**高度上界: LaserScan 的点全在雷达实际高度上, 一旦上界比
          # 实际高度低, 整条雷达数据会被丢掉 —— 这个耦合太危险。高度范围交给体素网格管。
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          observation_persistence: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        depth_cloud:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.25
          # 同局部图: 必须 0.0, 详见 local_costmap 里的说明(persistence>0 会堆 20 万个点)
          observation_persistence: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.6
          obstacle_max_range: 3.0
          obstacle_min_range: 0.6
      static_layer: # 静态地图层(来自 map_server 的 pgm 地图)
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 # 值越大代价下降越快, 膨胀区更"陡"
        inflation_radius: 0.40 # 膨胀半径, 单位米
      always_send_full_costmap: True
map_server:
  ros__parameters:
    use_sim_time: False
    # launch 里通过 map 参数注入实际路径 (由 RewrittenYaml 重写 yaml_filename)
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
    # GridBased:
    #   plugin: "rrt_planner/RRTPlannerPlugin"
    #   step_size: 0.5    # 单次生长步长（m）
    #   iter_max: 5000    # 最大迭代次数

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 1.0] # [x线速度 m/s, y线速度, 角速度 rad/s]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
